services:
  signaling:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      RemoteDesk__BootstrapToken: "${REMOTEDESK_BOOTSTRAP_TOKEN:?set REMOTEDESK_BOOTSTRAP_TOKEN}"
      RemoteDesk__OperatorKey: "${REMOTEDESK_OPERATOR_KEY:?set REMOTEDESK_OPERATOR_KEY}"
      RemoteDesk__SigningKey: "${REMOTEDESK_SIGNING_KEY:?set REMOTEDESK_SIGNING_KEY}"
      RemoteDesk__PostgresConnection: "Host=db;Port=5432;Database=swiftdesk;Username=swiftdesk;Password=${SWIFTDESK_DB_PASSWORD:?set SWIFTDESK_DB_PASSWORD}"
      RemoteDesk__RedisConnection: "redis:6379"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    command:
      - caddy
      - reverse-proxy
      - --from
      - "${SWIFTDESK_DOMAIN:?set SWIFTDESK_DOMAIN}"
      - --to
      - signaling:8080
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - signaling
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: swiftdesk
      POSTGRES_USER: swiftdesk
      POSTGRES_PASSWORD: "${SWIFTDESK_DB_PASSWORD:?set SWIFTDESK_DB_PASSWORD}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swiftdesk"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - oracle_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  oracle_pgdata:
